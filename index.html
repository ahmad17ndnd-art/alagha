<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway — Access Control</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- ==================== شاشة تسجيل الدخول ==================== -->
<div id="login-view">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">🔐</div>
      <div>
        <h1 data-i18n="brand_name">بوابة</h1>
        <span data-i18n="brand_sub">نظام التحكم بالدخول</span>
      </div>
    </div>

    <div class="error-msg" id="login-error"></div>
    <div class="success-msg" id="login-success"></div>

    <!-- 1) تسجيل دخول عادي بالإيميل وكلمة المرور -->
    <div id="step-login">
      <div class="field">
        <label data-i18n="email">البريد الإلكتروني</label>
        <input type="email" id="login-email" data-i18n-placeholder="email">
      </div>
      <div class="field">
        <label data-i18n="password">كلمة المرور</label>
        <input type="password" id="login-password" data-i18n-placeholder="password">
      </div>
      <button class="btn btn-primary" id="btn-login" data-i18n="login_btn">تسجيل الدخول</button>
      <button class="link-btn" id="btn-show-forgot" data-i18n="forgot_password">نسيت كلمة المرور؟</button>

      <div class="divider"><span data-i18n="or">أو</span></div>
      <div id="google-btn-container"></div>
    </div>

    <!-- 2) أول مرة: تحديد كلمة مرور -->
    <div id="step-set-password" style="display:none">
      <h3 data-i18n="set_password_title" style="margin-bottom:6px;font-size:15px;">حدد كلمة مرور جديدة</h3>
      <p data-i18n="set_password_desc" style="color:var(--text-dim);font-size:12px;margin-bottom:16px;"></p>
      <div class="field">
        <label data-i18n="new_password">كلمة المرور الجديدة</label>
        <input type="password" id="setpw-password">
      </div>
      <button class="btn btn-primary" id="btn-set-password" data-i18n="confirm">تأكيد</button>
    </div>

    <!-- 3) نسيت كلمة المرور: طلب الرمز -->
    <div id="step-forgot" style="display:none">
      <h3 data-i18n="forgot_title" style="margin-bottom:6px;font-size:15px;"></h3>
      <p data-i18n="forgot_desc" style="color:var(--text-dim);font-size:12px;margin-bottom:16px;"></p>
      <div class="field">
        <label data-i18n="email">البريد الإلكتروني</label>
        <input type="email" id="forgot-email">
      </div>
      <button class="btn btn-primary" id="btn-send-code" data-i18n="send_code"></button>
      <button class="link-btn" id="btn-back-login-1" data-i18n="back_to_login"></button>
    </div>

    <!-- 4) إدخال الرمز وكلمة مرور جديدة -->
    <div id="step-reset" style="display:none">
      <h3 data-i18n="reset_title" style="margin-bottom:16px;font-size:15px;"></h3>
      <div class="field">
        <label data-i18n="code"></label>
        <input type="text" id="reset-code">
      </div>
      <div class="field">
        <label data-i18n="new_password"></label>
        <input type="password" id="reset-password">
      </div>
      <button class="btn btn-primary" id="btn-reset-password" data-i18n="save"></button>
      <button class="link-btn" id="btn-back-login-2" data-i18n="back_to_login"></button>
    </div>
  </div>
</div>

<!-- ==================== الداشبورد ==================== -->
<div id="app-view">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🔐</div>
      <div>
        <h1 data-i18n="brand_name" style="font-size:15px;">بوابة</h1>
      </div>
    </div>

    <button class="nav-item active" data-view="overview">
      <span class="icon">🏠</span><span data-i18n="nav_overview">لوحة التحكم</span>
    </button>
    <button class="nav-item" data-view="cards">
      <span class="icon">💳</span><span data-i18n="nav_cards">البطاقات</span>
    </button>
    <button class="nav-item" data-view="emergency">
      <span class="icon">🚨</span><span data-i18n="nav_emergency">الطوارئ</span>
    </button>
    <button class="nav-item" data-view="logs">
      <span class="icon">📋</span><span data-i18n="nav_logs">السجل</span>
    </button>
    <button class="nav-item" data-view="notifications">
      <span class="icon">🔔</span><span data-i18n="nav_notifications">الإشعارات</span>
      <span class="nav-badge" id="notif-badge" style="display:none">0</span>
    </button>
    <button class="nav-item" data-view="settings">
      <span class="icon">⚙️</span><span data-i18n="nav_settings">الإعدادات</span>
    </button>

    <div class="sidebar-footer">
      <button class="pill-btn" id="btn-lang-toggle" style="width:100%; justify-content:center;">🌐 <span id="lang-label">EN</span></button>
      <button class="btn btn-outline" id="btn-logout" data-i18n="logout">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main">
    <!-- نظرة عامة -->
    <section class="view-section active" id="view-overview">
      <div class="topbar">
        <h2 data-i18n="nav_overview">لوحة التحكم</h2>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_total_cards"></div>
          <div class="stat-value" id="stat-total-cards">–</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_allowed"></div>
          <div class="stat-value" id="stat-allowed">–</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_today_events"></div>
          <div class="stat-value" id="stat-today-events">–</div>
        </div>
        <div class="stat-card">
          <div class="stat-label" data-i18n="stat_unread_notif"></div>
          <div class="stat-value" id="stat-unread-notif">–</div>
        </div>
      </div>

      <div class="door-card">
        <span class="door-status-dot"></span>
        <span data-i18n="door_status_online" style="font-size:12px;color:var(--text-dim);margin-inline-start:6px;"></span>
        <div>
          <button class="door-open-btn" id="btn-open-door">
            <span class="icon">🔓</span>
            <span data-i18n="open_door">فتح الباب</span>
          </button>
        </div>
      </div>

      <div class="card-panel">
        <div class="panel-header"><h3 data-i18n="nav_logs">آخر الحركات</h3></div>
        <div id="recent-logs-table"></div>
      </div>
    </section>

    <!-- البطاقات -->
    <section class="view-section" id="view-cards">
      <div class="topbar">
        <h2 data-i18n="nav_cards">البطاقات</h2>
        <button class="btn btn-primary" style="width:auto;" id="btn-add-card" data-i18n="add_card"></button>
      </div>
      <div class="card-panel">
        <div id="cards-table"></div>
      </div>
    </section>

    <!-- الطوارئ -->
    <section class="view-section" id="view-emergency">
      <div class="topbar"><h2 data-i18n="nav_emergency">بطاقات الطوارئ</h2></div>
      <p data-i18n="emergency_desc" style="color:var(--text-dim);font-size:13px;margin-bottom:18px;max-width:560px;"></p>
      <div class="card-panel">
        <div id="emergency-table"></div>
      </div>
    </section>

    <!-- السجل -->
    <section class="view-section" id="view-logs">
      <div class="topbar"><h2 data-i18n="nav_logs">سجل الدخول والخروج</h2></div>
      <div class="card-panel">
        <div id="logs-table"></div>
      </div>
    </section>

    <!-- الإشعارات -->
    <section class="view-section" id="view-notifications">
      <div class="topbar">
        <h2 data-i18n="nav_notifications">الإشعارات</h2>
        <button class="btn-sm" id="btn-mark-all-read" data-i18n="mark_all_read"></button>
      </div>
      <div class="card-panel">
        <div id="notifications-list"></div>
      </div>
    </section>

    <!-- الإعدادات -->
    <section class="view-section" id="view-settings">
      <div class="topbar"><h2 data-i18n="nav_settings">الإعدادات</h2></div>

      <div class="card-panel">
        <div class="panel-header"><h3 data-i18n="settings_notif_title"></h3></div>
        <div class="toggle-row">
          <span data-i18n="notify_email_enabled"></span>
          <label class="switch"><input type="checkbox" id="toggle-email-enabled"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <span data-i18n="notify_on_denied"></span>
          <label class="switch"><input type="checkbox" id="toggle-on-denied"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <span data-i18n="notify_on_door_open"></span>
          <label class="switch"><input type="checkbox" id="toggle-on-door-open"><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
          <span data-i18n="notify_on_emergency"></span>
          <label class="switch"><input type="checkbox" id="toggle-on-emergency"><span class="slider"></span></label>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ==================== مودال إضافة/تعديل بطاقة ==================== -->
<div class="modal-overlay" id="card-modal">
  <div class="modal">
    <h3 id="card-modal-title" data-i18n="modal_add_card_title"></h3>
    <input type="hidden" id="card-id">
    <div class="field">
      <label data-i18n="field_uid"></label>
      <input type="text" id="card-uid" class="mono">
    </div>
    <div class="field">
      <label data-i18n="field_name"></label>
      <input type="text" id="card-name">
    </div>
    <div class="select-row">
      <div style="flex:1">
        <label data-i18n="field_status" style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;"></label>
        <select id="card-status">
          <option value="allowed" data-i18n="allowed"></option>
          <option value="denied" data-i18n="denied"></option>
        </select>
      </div>
      <div style="flex:1">
        <label data-i18n="field_type" style="font-size:12px;color:var(--text-dim);display:block;margin-bottom:6px;"></label>
        <select id="card-type">
          <option value="permanent" data-i18n="permanent"></option>
          <option value="temporary" data-i18n="temporary"></option>
        </select>
      </div>
    </div>
    <div id="temp-fields" style="display:none">
      <div class="field">
        <label data-i18n="field_valid_from"></label>
        <input type="datetime-local" id="card-valid-from">
      </div>
      <div class="field">
        <label data-i18n="field_valid_to"></label>
        <input type="datetime-local" id="card-valid-to">
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="card-emergency">
      <label for="card-emergency" data-i18n="field_emergency"></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="btn-cancel-card" data-i18n="cancel"></button>
      <button class="btn btn-primary" id="btn-save-card" data-i18n="save_card"></button>
    </div>
  </div>
</div>

<script>
  // ⚙️ عدّل هالقيم بعد ما تنشر السيرفر وتاخد Google Client ID
  window.RFID_API_BASE = "http://localhost:8000";
  window.RFID_GOOGLE_CLIENT_ID = "";
</script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
